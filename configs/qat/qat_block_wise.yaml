global:
  save_path: ./output

model:
  name: Qwen # angelslim model name
  model_path: Qwen/Qwen3-4B # your model path or hf model name
  trust_remote_code: true
  torch_dtype: auto
  device_map: auto
  low_cpu_mem_usage: true
  use_cache: false

compression:
  name: QAT
  quantization:
    name: w4a8_fp8 # or fp8_static or fp8_dynamic
    bits: 8
    quant_method:
      weight: per-group # or per-tensor
      activation: per-tensor
      group_size: 128 # or -1
    ignore_layers: ["lm_head", "embed_tokens"] # Skip quantization for these layers
  # QAT-specific configuration
  QAT:
    hf_dataset: Salesforce/wikitext,wikitext-2-raw-v1 # hf dataset name, will overwrite dataset.data_path
    hf_cache_dir: '' # your cache path, default is None
    training_mode: blockwise
    dist_mode: hf # "hf" is using hf Trainer
    save_format: fake # or real. Default is None(skip save)
    do_train: true
    resume_ckpt_dir: '' # resume for fake checkpoint, when save_format=='fake'. Default is None
    block_wise_config:
      epochs: 10
      batch_size: 2
      train_size: 4096
      training_seqlen: 2048
      quant_lr: 1e-4 # lr for quant params
      weight_lr: 1e-4 # lr for weight
      min_lr_factor: 20 # min lr factor for scheduler
      wd: 0 # weight decay
    plugin_config:
      enable_scale: true
      quant_config:
        use_weight_quant: true
        use_activation_quant: true
        lazy_init_samples: 60
        weight: # can overwrite compression.quantization
          qtype: int8
          granularity: per-tensor
          group_size: 128
          is_sym: true
        activation: # can overwrite compression.quantization
          qtype: int8
          granularity: per-tensor
          is_sym: true
          dynamic: false

dataset:
  name: TextDataset
  data_path: ./dataset/sharegpt_gpt4_qwen/sharegpt_gpt4-qwen3_a22B_output.jsonl
  max_seq_length: 2048
  num_samples: 256
  batch_size: 1

