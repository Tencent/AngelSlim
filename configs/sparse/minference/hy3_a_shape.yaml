# MInference A-shape (StreamingLLM) sparse-attention (Hunyuan-V3 / hy_v3).
# `a_shape` = attention sink (first n_init keys) + sliding window
# (last n_local keys). No pattern JSON needed — fully static.
# NOTE: the full Hunyuan-V3 checkpoint (~80 layers) does not fit on one GPU;
#   `device_map: auto` shards it across every visible GPU. Point `model_path`
#   at your local checkpoint if `tencent/Hy3` is not cached.
# Run:  python tools/run.py -c configs/sparse/minference/hy3_a_shape.yaml

global:
  save_path: ./output

model:
  name: HYV3MoE
  model_path: tencent/Hy3
  trust_remote_code: true
  low_cpu_mem_usage: true
  use_cache: false
  torch_dtype: auto
  device_map: auto
  # Decode runs the model's configured attention; sparse prefill bypasses it.
  attn_implementation: flash_attention_2

compression:
  name: Sparsity
  sparsity:
    name: a_shape
    allow_pseudo_sparse: false      # real Triton streaming kernel; set true only
                                    # to force the slow torch reference
    attn_kwargs:
      n_init: 128                   # attention-sink keys (always kept)
      n_local: 3968                 # sliding-window keys (most recent)
