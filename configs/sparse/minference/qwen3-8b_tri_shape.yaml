# MInference Tri-shape sparse-attention (Qwen3-8B).
# `tri_shape` = a_shape (sink + sliding window) on all but the last
# n_last queries, plus full-causal attention for the last n_last queries.
# Run:  python tools/run.py -c configs/sparse/minference/qwen3-8b_tri_shape.yaml

global:
  save_path: ./output

model:
  name: Qwen
  model_path: Qwen/Qwen3-8B
  trust_remote_code: true
  low_cpu_mem_usage: true
  use_cache: false
  torch_dtype: auto
  device_map: auto
  attn_implementation: flash_attention_2

compression:
  name: Sparsity
  sparsity:
    name: tri_shape
    allow_pseudo_sparse: false      # real Triton streaming kernel; set true only
                                    # to force the slow torch reference
    attn_kwargs:
      n_init: 128                   # attention-sink keys
      n_local: 3968                 # sliding-window keys
      n_last: 100                   # last-query block that attends fully (causal)
