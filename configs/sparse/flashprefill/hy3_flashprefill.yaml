# FlashPrefill max-based dynamic-threshold sparse attention (Hunyuan-V3 / hy_v3).
# FlashPrefill (Fan et al., arXiv:2603.06199) keeps, per
# query-block, the key-blocks whose block-approximate energy clears a Max-based
# Dynamic Threshold `alpha * peak` (no Top-k sort, no Top-p cumsum), plus an
# attention sink + a local window. `alpha` is the sole hyperparameter: alpha=0
# keeps everything (== dense), larger is sparser.
#
# CLEAN-ROOM: the upstream repo (qhfan/FlashPrefill) is unlicensed, so the
# license fail-open policy forbids vendoring its code. This algorithm implements
# the *method* from the paper (original AngelSlim code) and runs the selected-
# block attention on block_sparse_attn (the same BSD-3-Clause kernel Stem / xattention
# use). Hunyuan-V3 head_dim 128 -> real kernel path; head_dim 256 (Qwen3.5)
# miscomputes on block_sparse_attn -> torch reference (set allow_pseudo_sparse).
# NOTE: the full Hunyuan-V3 checkpoint (~80 layers) does not fit on one GPU;
#   `device_map: auto` shards it across every visible GPU. Point `model_path`
#   at your local checkpoint if `tencent/Hy3` is not cached.
# Run:  python tools/run.py -c configs/sparse/flashprefill/hy3_flashprefill.yaml

global:
  save_path: ./output

model:
  name: HYV3MoE
  model_path: tencent/Hy3
  trust_remote_code: true
  low_cpu_mem_usage: true
  use_cache: false
  torch_dtype: auto
  device_map: auto
  # Decode runs the model's configured attention; sparse prefill bypasses it.
  attn_implementation: flash_attention_2

compression:
  name: Sparsity
  sparsity:
    name: flashprefill
    allow_pseudo_sparse: false      # real block_sparse_attn path; set true only
                                    # to force the slow torch reference (head_dim 256)
    attn_kwargs:
      alpha: 0.2                    # max-based dynamic threshold factor (sole
                                    # hyperparameter; 0 == dense, larger = sparser)
      block_size: 128               # uniform block size (paper §4)
      sink: 256                     # attention-sink tokens always retained
      window: 512                   # local-window tokens always retained
      last_n_block_full: 2          # last N query-blocks attend every causal block
