# ===========================================================================
# GLM-5 (GlmMoeDsaForCausalLM) — "kunlun" recipe equivalent (INT8 W8A8C8).
#
# Semantic 1-to-1 match with ``kunlunw8a8/recipe.yaml``:
#   ignore: [
#     're:^mtp\.eh_proj$', 're:.*eh_proj$', 're:.*mlp.gate$',
#     're:.*embed_tokens$', 're:.*self_attn\.indexer*', lm_head
#   ]
# translated into AngelSlim's substring-based ``ignore_layers`` (below).
#
# Recipe summary
# --------------
#   Weights  -> INT8 per-channel        (symmetric)
#   Activ.   -> INT8 per-token dynamic  (no static scale)
#   KV cache -> INT8 DYNAMIC on two streams:
#                * MLA NoPE latent : per-block-128 (4 x 128 over kv_lora_rank=512;
#                                    RoPE tail stays bf16 passthrough)
#                * DSA indexer K   : per-token
#              Scales are NOT persisted; ``config.json.kv_cache_scheme``
#              tells vLLM to rebuild the layout at inference time.
#   Ignored  -> lm_head / embed_tokens / mlp.gate.* /
#               model.layers.<N>.eh_proj (MTP fuse) /
#               self_attn.indexer.{wq_b, wk, weights_proj, k_norm}
#
# Everything else (q_a_proj, q_b_proj, kv_a_proj_with_mqa, kv_b_proj,
# o_proj, MoE experts.<i>.{gate,up,down}_proj, shared_experts.*, dense MLP)
# is INT8 quantized.
#
# The default GLM-5 adapter already hard-skips the truly dangerous entries
# (router / lm_head / embed / eh_proj / indexer.k_norm) so this YAML only
# needs to opt out of ``.indexer.wq_b`` / ``.indexer.wk`` /
# ``.indexer.weights_proj`` -- the three DSA indexer linears the kunlun
# recipe excludes from int8.
# ===========================================================================

global:
  save_path: ./output_glm5_w8a8_kunlun_fixed

model:
  name: GLM5
  model_path: /apdcephfs_zwfy2/share_300532381/harviexu/chatglm5.2
  trust_remote_code: true
  low_cpu_mem_usage: true
  use_cache: false
  device_map: auto
  # Two-node expert-parallel + no ZeRO-3 (H20-safe pre-shard path).
  enable_expert_parallel: true
  zero3: false

compression:
  name: PTQ
  quantization:
    name: int8_dynamic
    bits: 8
    low_memory: true             # H20 96GB block-streamed CPU->GPU
    quant_method:
      weight: "per-channel"
      activation: "per-token"     # dynamic, no static scale
      kv_cache: "per-tensor"      # triggers apply_kvcache_observers +
                                  # _extra_kv_cache_scheme emission
    quant_helpers:
      - "smooth"
    smooth_alpha: 0.5
    # Layers to skip for the kunlun recipe.  Substrings are matched against
    # the fully-qualified layer name (same semantics gptq / daq / save
    # already use downstream).  The GLM-5 adapter appends its own hard-
    # skip set (lm_head / embed_tokens / mlp.gate. / eh_proj /
    # .indexer.k_norm) automatically, so we only list the DSA indexer big
    # linears here.
    ignore_layers:
      - ".indexer.wq_b"           # DSA query down-proj
      - ".indexer.wk"             # DSA key down-proj
      - ".indexer.weights_proj"   # DSA per-head gating

dataset:
  name: TextDataset
  data_path: /apdcephfs_sgfd2/share_300532381/harviexu/AngelSlim/dataset/merge3.jsonl
  max_seq_length: 4096
  num_samples: 480 # 256
  batch_size: 1
