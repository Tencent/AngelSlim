global:
  save_path: ./output_mcore_qad

model:
  # MCoreQAD dispatches by model_type in config.json; name is descriptive only.
  name: Qwen
  model_path: /path/to/Qwen3-30B-A3B

compression:
  name: MCoreQAD
  MCoreQAD:
    checkpoint_path: /path/to/mcore-checkpoint/qwen3-moe
    checkpoint_conversion_cpu: false
    # nvfp4 | nvfp4a16 | w4a16 | w8a8 | fp8 | w4afp8
    format: nvfp4
    init_scales_path: null
    lm_weight: 1.0
    distill_weight: 0.0
    distill_type: kl
    distill_temperature: 1.0
    distill_topk: 0
    experts_only: false
    seq_len: 2048
    micro_batch_size: 8
    train_iters: 200
    recompute: true
    save_every: 0
    parallel:
      tensor_parallel: 1
      pipeline_parallel: 1
      expert_parallel: 8
      context_parallel: 1
      sequence_parallel: false
    optim:
      lr: 2.0e-4
      weight_decay: 0.0
      betas: [0.9, 0.95]
      grad_clip: 1.0

dataset:
  name: TextDataset
  data_path: /path/to/sharegpt.jsonl
