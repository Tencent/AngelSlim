global:
  save_path: ./output/qwen3-4b-focus-nvfp4-w4a4-zero3

model:
  name: Qwen
  model_path: Qwen/Qwen3-4B
  trust_remote_code: true
  torch_dtype: auto
  device_map: None
  low_cpu_mem_usage: true
  use_cache: false

compression:
  name: QAT
  quantization:
    name: nvfp4
    bits: 4
    quant_method:
      weight: per-group
      activation: per-tensor
      group_size: 16
    ignore_layers: ["lm_head", "embed_tokens"]
  QAT:
    hf_dataset: Salesforce/wikitext,wikitext-2-raw-v1
    training_mode: end2end
    dist_mode: hf
    save_format: fake
    do_train: true
    from_ptq_ckpt: null
    loss_type: kl_top
    # Preserve the legacy FOCUS objective explicitly; bare kl_top otherwise
    # falls back to 1000 inside DistillLoss.
    loss_topk: 1000
    kd_temperature: 1.0
    kd_alpha: 0.5
    lm_loss_weight: 0.0
    kd_loss_weight: 1.0
    plugin_config:
      enable_scale: true
      quant_config:
        use_weight_quant: true
        use_activation_quant: true
        use_qkv_quant: false
        lazy_init_samples: 10
        learnable:
          act_scale: false
          weight_scale: true
          quant_max_scale_lr: 1.0e-3
          kv_scale: false
          norm: false
          lwc: false
        weight:
          qtype: nvfp4
          granularity: per-group
          group_size: 16
          is_sym: true
          dynamic: false
          mantissa_rounding: nearest
          use_subgroup_scale: true
          num_sub: 2
        activation:
          qtype: nvfp4
          granularity: per-group
          group_size: 16
          is_sym: true
          dynamic: true
          mantissa_rounding: nearest
    hf_args:
      bf16: true
      seed: 42
      data_seed: 42
      logging_steps: 1
      logging_first_step: true
      per_device_train_batch_size: 2
      gradient_accumulation_steps: 8
      learning_rate: 5.0e-3
      lr_scheduler_type: constant
      num_train_epochs: 1
      save_strategy: "no"
      gradient_checkpointing: true
      gradient_checkpointing_kwargs:
        use_reentrant: true
      report_to: none
      deepspeed: configs/qwen3/fp4/ds_config_zero3_focus.json

dataset:
  name: TextDataset
  data_path: ./dataset/sharegpt_gpt4_qwen/sharegpt_gpt4-qwen3_a22B_output.jsonl
  max_seq_length: 2048
  num_samples: 256
  batch_size: 1
