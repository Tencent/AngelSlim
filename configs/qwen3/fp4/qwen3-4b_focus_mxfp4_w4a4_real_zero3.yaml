global:
  save_path: ./output/qwen3-4b-focus-mxfp4-w4a4-real-zero3

model:
  name: Qwen
  model_path: Qwen/Qwen3-4B
  trust_remote_code: true
  torch_dtype: auto
  device_map: None
  low_cpu_mem_usage: true
  use_cache: false

compression:
  name: QAT
  quantization:
    # Concrete MXFP4 settings are defined by the QAT plugin below.
    name: w4a8_fp8
    bits: 4
    quant_method:
      weight: per-group
      activation: per-tensor
      group_size: 32
    ignore_layers: ["lm_head", "embed_tokens"]
  QAT:
    hf_dataset: Salesforce/wikitext,wikitext-2-raw-v1
    training_mode: end2end
    dist_mode: hf
    save_format: real
    do_train: true
    from_ptq_ckpt: null
    loss_type: kl_top
    loss_topk: 1000
    kd_temperature: 1.0
    kd_alpha: 0.5
    lm_loss_weight: 0.0
    kd_loss_weight: 1.0
    plugin_config:
      enable_scale: true
      quant_config:
        use_weight_quant: true
        use_activation_quant: true
        use_qkv_quant: false
        lazy_init_samples: 10
        learnable:
          act_scale: false
          weight_scale: true
          quant_max_scale_lr: 5.0e-2
          kv_scale: false
          norm: false
          lwc: false
        weight:
          qtype: mxfp4_rceil
          granularity: per-group
          group_size: 32
          is_sym: true
          dynamic: false
          mantissa_rounding: even
          use_subgroup_scale: true
          num_sub: 4
        activation:
          qtype: mxfp4_rceil
          granularity: per-group
          group_size: 32
          is_sym: true
          dynamic: true
          mantissa_rounding: even
    hf_args:
      bf16: true
      logging_steps: 1
      logging_first_step: true
      per_device_train_batch_size: 1
      gradient_accumulation_steps: 16
      learning_rate: 2.0e-2
      lr_scheduler_type: constant
      num_train_epochs: 1
      save_strategy: "no"
      gradient_checkpointing: true
      gradient_checkpointing_kwargs:
        use_reentrant: true
      report_to: none
      deepspeed: configs/qwen3/fp4/ds_config_zero3_focus.json

dataset:
  name: TextDataset
  data_path: ./dataset/sharegpt_gpt4_qwen/sharegpt_gpt4-qwen3_a22B_output.jsonl
  max_seq_length: 2048
  num_samples: 256
  batch_size: 1
